## 1. Project History & Original Problem

The starting file (`trashcanfinaldraft (Copy).html`) was a basic flat HTML game:
- Solid dark background, flat blue rectangle bin (emoji block 🗑️)
- Trash items were plain emoji in flat red boxes
- Basic `mousedown`/`touchstart` drag with clunky clamping
- Score counter plain text, `alert()` for winning
- No animations, no particles, no depth — felt like a demo, not a game

### Original 17 Requirements
1. Cartoon/3D visual style, gradients, lighting, depth, gloss, eco theme
2. Park/street environment: dark blue-green bg, trees, bushes, pavement, leaves, layered depth
3. 3D trash can: lid, rim, handles, wheels, recycling symbol, highlights, ground shadow
4. Bin idle bob + glow pulse; lid opens when trash is near; happy bounce + sparkles on collect
5. 10 trash types (🍌🥫📄🧴🍫🥤📦📰🍾🥡), varied size/rotation/position, depth
6. Spawn animation: fall + rotate + land bounce
7. Idle animation: random subtle wobble per item
8. Drag: scale up, stronger shadow, z-front, smooth, touch + scroll prevention
9. Collection: fly to bin → shrink → rotate → disappear → particles → lid close → bounce → "+1" → popup
10. Particles: green sparkles, dust, floating leaves, bin glow, celebration on win
11. Score HUD: glass pill, recycling icon, glowing border, number animation
12. Buttons: gradient 3D, hover lift, press-down, glow, icon + text
13. Win screen: custom overlay (not alert), "Environment Cleaned! 🌱", score, particles, Play Again
14. Mobile responsive, pointer events, no scroll-while-drag
15. Performance: no heavy libraries, CSS animations, no leaks
16. Single file, inline CSS/JS, clear comments
17. Extra polish: smooth transitions, cubic-bezier easing, micro-interactions, prefers-reduced-motion

## 8. Trash Items (z-index 5)

- **.trash-inner:** 100% box, radius 12px, `font-size: 1.8rem`, shadow `0 4px 12px black .35`; `::after` gloss highlight top-left 40%×30% white(0.15)
- **States:**
  - `.spawning` → `trashSpawn` 0.6s cubic-bezier(.34,1.56,.64,1): Y -80 scale .3 rot 30° → Y 10 scale 1.05 rot -5° → Y -5 scale .98 rot 2° → rot `var(--rot)`
  - `.idle-wobble` → `idleWobble` `var(--wobble-dur, 3–6s)` infinite, ±2° rotation, ±2px Y
  - `.dragging` → `z-index: 999 !important; transition: none !important`; inner scales 1.2, rotates -5°, shadow `0 12px 30px black .5` + accent glow
  - `.collecting` → `trashCollect` 0.5s cubic-bezier(.55,.085,.68,.53): scale → 0.6 (+ rot 180°) → 0 (+ rot 360°), opacity → 0
  - `.returning` → `trashReturn` 0.4s: scale 1.1 → 0.95 (rot 3°) → 1 (bounce-back on missed drop)

## 16. Functions (logic + exact timings)

### Scene & Build
- **buildScene()** — moon + 30 stars + 4 trees + 4 bushes + ground/pavement + atmosphere + 6 floating leaves
- **buildTrashCan()** — creates bin wrapper (lid, knob, opening, body, handles, wheels)
- **buildScoreHud()** — `♻  0 / 10`
- **buildWinOverlay()** — title, subtitle, score, Play Again button (wired to reset + initGame)
- **buildThankYouPopup()** — empty div

### Particles
- **spawnParticles(x, y, count, type='green')** — burst; leaf = 10px else 4–10px; distance 30–80px; element removed after 1000ms
- **spawnWinParticles()** — 20 falling emojis from [🌱🌿🍃💚✨🌍♻️🎉]; removed after 6000ms

### Score
- **updateScore()** — score++ → `.bump` + `.score-pulse` (300ms) → floating "+1" at center, bottom 45% (1100ms) → random feedback message (900ms)
- **showThankYou(msg)** — shows green pill 900ms (uses element-scoped `_timer` property; `clearTimeout` prevents stacking)

### Spawning
- **spawnTrash()** — random type; size randomized ±4px; rotation ±15deg; wobble duration 3–6s, delay 0–2s; spawns only in top 55% of container (avoids bin area); switches `.spawning` → `.idle-wobble` after 650ms

### Drag & Drop (closure-based, no jitter)
- **makeDraggable(el)** — local vars `startX/startY/origLeft/origTop/isDragging`; attaches `pointerdown` (passive:false) + `mousedown` fallback
  - **onStart:** preventDefault; records pointer pos + element pos; adds `.dragging`, removes `.idle-wobble`, sets `animation: none`; registers document listeners: `pointermove{passive:false}`, `pointerup`, `pointercancel`, plus `mousemove` + `mouseup` fallback
  - **onMove:** preventDefault; position = orig + delta (no jitter); clamps to container bounds; applies; calls `checkBinProximity`
  - **onEnd:** removes all 5 document listeners; removes `.dragging`; drops on bin → `collectTrash`, otherwise `.returning` bounce (450ms) then resumes `.idle-wobble` (+100ms); calls `resetBinProximity`

### Bin Interaction
- **checkBinProximity(el)** — `hypot` of center distance; **< 150px** → bin `.near-trash` + lid `.open`
- **resetBinProximity()** — restores `.idle`, closes lid
- **isOverlappingBin(el)** — AABB hit-test with **+20px padding** on all bin sides

### Collection
- **collectTrash(el)** — full animated sequence (see timeline below)
- **triggerWin()** — stops game (isGameActive = false, clearInterval); after 600ms shows overlay + confetti
- **initGame()** — full teardown (`container.innerHTML = ''` → no memory leaks) → rebuild scene/bin/HUD/popup/overlay → spawn interval 2200ms → 3 initial trash at 300ms stagger

### Buttons
- **New Game** — `confirm('Restart the game?')` if score > 0 && active, then `initGame()`
- **Add More Trash** — 3 spawns at 200ms stagger

### Boot
- `initGame()` called once at script end

```
T+0ms     trash flies to bin center (transition 'all 0.35s cubic-bezier .55,.085,.68,.53'),
          targetY = bin top + height/3, lid opens

          item removed from DOM + state; updateScore(); win check

## 18. Implementation Quirks (remember when editing)

1. `state.activeDrag` and `state.animFrame` are declared but unused
2. Trash only spawns in the top 55% of the container
3. Proximity lid-open threshold = 150px; drop hit-test = +20px padding AABB
4. No listener leaks: drag listeners attach to `document` inside closures and are always removed on `onEnd`
5. Only native dialog left in the game: `confirm()` on New Game reset
6. Trash colors come from `CONFIG.TRASH_ITEMS` gradients; size/rotation/wobble randomized at spawn
7. Mobile size override uses `!important` on trash items

---

## 19. Remaining Gaps / Change Ideas

- `confirm()` still used — could be replaced with a custom modal
- No timer / level system / difficulty ramp (spawn interval is fixed at 2200ms)
- No sound effects (completely silent)
- No local storage / high score saving between sessions
- Trash items can overlap each other; no spawn-collision check
- Bin color hardcoded blue; no theme picker
- `WIN_SCORE` hardcoded to 10; not adjustable in the UI
- No pause / mute / settings menu
- No per-type trash stats (e.g., "3 cans collected")
